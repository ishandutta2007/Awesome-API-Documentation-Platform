<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#accent-grad); letter-spacing: -1px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #38bdf8; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #f1f5f9; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .pulse-circle { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .floating { animation: floatSlow 6s ease-in-out infinite; }
      .floating-delayed { animation: floatSlow 6s ease-in-out 3s infinite; }
      .flow-line { stroke-dasharray: 6, 6; animation: dashAnim 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" />
    <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420 M800 0 V420 M900 0 V420 M1000 0 V420 M1100 0 V420" />
  </g>

  <!-- Dynamic Glowing Ambient Spheres -->
  <circle cx="150" cy="120" r="140" fill="#38bdf8" opacity="0.15" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1050" cy="280" r="180" fill="#818cf8" opacity="0.15" filter="url(#glow)" class="pulse-circle" style="animation-delay: 2s;" />
  <circle cx="650" cy="80" r="100" fill="#c084fc" opacity="0.12" filter="url(#glow)" class="pulse-circle" style="animation-delay: 1s;" />

  <!-- Main Left Content -->
  <g transform="translate(470, 75)">
    <!-- Badge -->
    <rect width="240" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" class="tag">CURATED ECOSYSTEM 2026</text>

    <!-- Title & Subtitle -->
    <text x="00" y="80" class="title">Awesome API Documentation</text>
    <text x="00" y="125" class="title" fill="#f8fafc">&amp; Developer Platforms</text>
    <text x="00" y="170" class="subtitle">OpenAPI • Swagger • Developer Portals • Docs-as-Code • SDK Tooling</text>

    <!-- Pill metrics -->
    <g transform="translate(00, 205)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="18" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">⚡ OpenAPI 3.1</text>

      <rect x="142" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="160" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#818cf8">📦 50+ Tools</text>

      <rect x="284" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="302" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">✨ Open-Source</text>
    </g>
  </g>

  <!-- Dynamic Interactive Diagram on Right -->
  <g transform="translate(780, 60)" class="floating">
    <!-- Connecting animated flow lines -->
    <path d="M 60 70 L 170 140" stroke="#38bdf8" stroke-width="2" opacity="0.6" class="flow-line" />
    <path d="M 280 70 L 170 140" stroke="#818cf8" stroke-width="2" opacity="0.6" class="flow-line" />
    <path d="M 170 180 L 170 240" stroke="#c084fc" stroke-width="2" opacity="0.7" class="flow-line" />

    <!-- Node 1: OpenAPI Spec -->
    <g transform="translate(0, 30)">
      <rect width="130" height="60" rx="10" fill="url(#box-grad)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="18" y="28" class="node-text">📄 OpenAPI</text>
      <text x="18" y="46" class="node-sub">Spec 3.0 / 3.1</text>
    </g>

    <!-- Node 2: Docs-as-Code -->
    <g transform="translate(210, 30)">
      <rect width="130" height="60" rx="10" fill="url(#box-grad)" stroke="#818cf8" stroke-width="1.5" />
      <text x="18" y="28" class="node-text">📝 Markdown</text>
      <text x="18" y="46" class="node-sub">MDX &amp; Guides</text>
    </g>

    <!-- Center Node: Platform Engine -->
    <g transform="translate(105, 125)">
      <rect width="140" height="64" rx="12" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" filter="url(#glow)" />
      <rect width="140" height="64" rx="12" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.5" />
      <text x="22" y="28" class="node-text" fill="#fdf4ff">⚡ Docs Engine</text>
      <text x="22" y="48" class="node-sub" fill="#e9d5ff">Render &amp; Test</text>
    </g>

    <!-- Node 3: Developer Experience -->
    <g transform="translate(75, 235)" class="floating-delayed">
      <rect width="200" height="64" rx="12" fill="url(#box-grad)" stroke="#34d399" stroke-width="1.5" />
      <circle cx="28" cy="32" r="10" fill="#34d399" opacity="0.2" />
      <circle cx="28" cy="32" r="4" fill="#34d399" />
      <text x="48" y="28" class="node-text">🚀 Dev Portal</text>
      <text x="48" y="48" class="node-sub">Interactive Playground + SDKs</text>
    </g>
  </g>
</svg>